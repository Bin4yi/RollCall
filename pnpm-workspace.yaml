packages:
  - apps/*
  - packages/*
  - tools/*

# esbuild and sharp ship binaries as optional dependencies, so their scripts aren't needed.
allowBuilds:
  esbuild: false
  sharp: false
  ffmpeg-static: true

minimumReleaseAgeExclude:
  - openai@7.52.0
  - '@playwright/test@1.65.0'
  - playwright-core@1.65.0
  - playwright@1.65.0
